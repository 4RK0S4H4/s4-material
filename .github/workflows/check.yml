name: Check
on:
  push:
  pull_request:
jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails if a token is invalid, an alias is broken, a color pair drops below WCAG AA,
      # or tokens.css / tokens.ts / tokens.json were edited by hand or not rebuilt.
      - run: npm run check
